name: strive-build

# Runs on every branch, matching tracking.yml. The previous main-only trigger meant branch work got
# no signal until a pull request existed, which is backwards: the build is most useful while the
# change is still being written.
#
# The paths below name the projects in strive.slnx rather than all of src/**, so a tracking-only
# change no longer starts a job that spins up Postgres for nothing. They are also, unlike the paths
# they replace, paths that exist — the previous list pointed at a test/ directory and at root-level
# build files that the c1dd7d7 restructure moved under src/, and only fired at all because a
# blanket 'src/**' entry happened to cover them.
on:
  push:
    paths:
      - 'src/Fip.Strive.AppHost/**'
      - 'src/Fip.Strive.Application/**'
      - 'src/Fip.Strive.Application.UnitTests/**'
      - 'src/Fip.Strive.IntegrationTests/**'
      - 'src/Fip.Strive.Web/**'
      - 'src/strive.slnx'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'src/NuGet.config'
      - 'src/global.json'
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - '.github/workflows/strive.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/Fip.Strive.AppHost/**'
      - 'src/Fip.Strive.Application/**'
      - 'src/Fip.Strive.Application.UnitTests/**'
      - 'src/Fip.Strive.IntegrationTests/**'
      - 'src/Fip.Strive.Web/**'
      - 'src/strive.slnx'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'src/NuGet.config'
      - 'src/global.json'
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - '.github/workflows/strive.yml'

jobs:
  build:

    # The integration tests start a throwaway Postgres through Testcontainers, so the runner
    # needs a working Docker daemon — preinstalled on GitHub's ubuntu images.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/strive.slnx

    # The formatter is pinned in .config/dotnet-tools.json, so this checks against the same
    # version everywhere rather than whatever the runner happens to resolve.
    - name: Restore tools
      run: dotnet tool restore

    - name: Check formatting
      run: dotnet csharpier check src/

    # -warnaserror is the point of this step: the MudBlazor and EF Core breakages that prompted
    # this gate were both warnings on an otherwise green build.
    - name: Build
      run: dotnet build --no-restore --configuration Release -warnaserror src/strive.slnx

    - name: Test
      run: dotnet test --no-build --configuration Release src/strive.slnx
