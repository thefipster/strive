name: strive-build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'strive.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - '.github/workflows/strive.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'strive.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - '.github/workflows/strive.yml'

jobs:
  build:

    # The integration tests start a throwaway Postgres through Testcontainers, so the runner
    # needs a working Docker daemon — preinstalled on GitHub's ubuntu images.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore strive.slnx

    - name: Build
      run: dotnet build --no-restore --configuration Release strive.slnx

    - name: Test
      run: dotnet test --no-build --configuration Release strive.slnx
