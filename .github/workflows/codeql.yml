name: codeql

# Static analysis on the default branch and on anything proposed to merge into it. The weekly run
# matters as much as the other two: advisories and query packs change without the code changing, so
# a repository that only scans on push stops learning anything the moment work pauses.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest

    permissions:
      # Only this job writes, and only to the code-scanning alert store.
      security-events: write
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        languages: csharp
        # No build. Buildless analysis costs a little precision, but it means this workflow cannot
        # be broken by a build change, does not need Docker for the Testcontainers projects, and
        # does not duplicate work strive.yml already does on every branch.
        build-mode: none
        # security-extended, not security-and-quality. The quality half produced 15 pull-request
        # comments on its first run and not one carried a security severity: missing Dispose calls
        # in tests, a Path.Combine warning that cannot fire because the later arguments are always
        # relative, and the deliberate catch-all in both health checks — which a readiness probe
        # has to have, or any unexpected failure crashes the endpoint instead of reporting
        # unhealthy. Those rules are already covered better by the .NET analyzers and -warnaserror
        # in the build workflows, which run on every branch rather than only on pull requests.
        #
        # security-extended keeps the deeper security queries, including the ones beyond the
        # default set. If this ever goes quiet for suspicious reasons, widen it again deliberately.
        queries: security-extended

    - name: Analyze
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        category: "/language:csharp"
