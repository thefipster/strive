name: tracking-build

# Unlike strive.yml this runs on every branch, not just main: the tracker is a small standalone
# app, and knowing it still compiles is worth having before a pull request exists.
on:
  push:
    paths:
      - 'src/Fip.Strive.Tracking.Application/**'
      - 'src/Fip.Strive.Tracking.Application.UnitTests/**'
      - 'src/Fip.Strive.Tracking.Web/**'
      - 'src/Fip.Strive.Tracking.Web.UnitTests/**'
      - 'src/tracking.slnx'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'src/NuGet.config'
      - 'NuGet.config'
      - 'src/global.json'
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - '.dockerignore'
      - '.github/workflows/tracking.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/Fip.Strive.Tracking.Application/**'
      - 'src/Fip.Strive.Tracking.Application.UnitTests/**'
      - 'src/Fip.Strive.Tracking.Web/**'
      - 'src/Fip.Strive.Tracking.Web.UnitTests/**'
      - 'src/tracking.slnx'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'src/NuGet.config'
      - 'NuGet.config'
      - 'src/global.json'
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - '.dockerignore'
      - '.github/workflows/tracking.yml'

# The default token grant is wider than either job needs — both only ever read the checkout.
permissions:
  contents: read

jobs:
  build:

    # No Docker needed for the tests — the tracker's whole database is a SQLite file in a temp
    # directory. The image build at the end is what wants a daemon.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/tracking.slnx

    # The formatter is pinned in .config/dotnet-tools.json, so this checks against the same
    # version everywhere rather than whatever the runner happens to resolve.
    - name: Restore tools
      run: dotnet tool restore

    - name: Check formatting
      run: dotnet csharpier check src/

    # -warnaserror is the point of this step: the MudBlazor and EF Core breakages that prompted
    # this gate were both warnings on an otherwise green build.
    - name: Build
      run: dotnet build --no-restore --configuration Release -warnaserror src/tracking.slnx

    - name: Test
      run: dotnet test --no-build --configuration Release src/tracking.slnx

    # `dotnet list package --vulnerable` exits 0 no matter what it finds, so the report has to be
    # read rather than the exit code trusted. This is the check that turned up a high-severity
    # advisory sitting in the tree under a green build.
    - name: Check for vulnerable packages
      run: |
        dotnet list src/tracking.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "::error::Vulnerable packages found - see the report above."
          exit 1
        fi

    - name: Build image
      run: docker build --file src/Fip.Strive.Tracking.Web/Dockerfile --tag strive-tracking:ci .
