<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign in — Tracker</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex, nofollow"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Deliberately standalone: the sign-in page loads no framework and opens no circuit. */
        :root {
            color-scheme: light dark;
            --ground: #f5f5f7;
            --card: #ffffff;
            --ink: #1a1a1c;
            --muted: #6b6b70;
            --line: #d9d9de;
            --accent: #594ae2;
            --danger: #b32121;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ground: #1a1a27;
                --card: #232333;
                --ink: #eeeef2;
                --muted: #a0a0ae;
                --line: #3a3a4d;
                --accent: #8b80f9;
                --danger: #f16c6c;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Exo", system-ui, sans-serif;
            background: var(--ground);
            color: var(--ink);
        }

        main {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        form {
            width: 100%;
            max-width: 22rem;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.5rem;
            letter-spacing: 0.08em;
        }

        p.lead {
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.7rem 0.8rem;
            font: inherit;
            color: var(--ink);
            background: var(--ground);
            border: 1px solid var(--line);
            border-radius: 0.4rem;
        }

        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.7rem;
            font: inherit;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: var(--accent);
            border: none;
            border-radius: 0.4rem;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .error {
            margin: 0 0 1rem;
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 0.4rem;
        }

        .error:not(.show) {
            display: none;
        }
    </style>
</head>

<body>
<main>
    <form method="post" action="/auth/login">
        <h1>Tracker</h1>
        <p class="lead">Sign in to log and review events.</p>

        <p class="error" id="error">That password did not match.</p>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required/>

        <button type="submit">Sign in</button>
    </form>
</main>

<script>
    // The form posts to a plain endpoint, which can only report failure back through the URL.
    if (new URLSearchParams(window.location.search).has('error')) {
        document.getElementById('error').classList.add('show');
    }
</script>
</body>

</html>
